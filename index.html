    <meta
      name="description"
      content="Yegna Trading supplies certified rebar in Ethiopia. Reliable stock, fair prices, and expert support for all construction projects."

    <link rel="apple-touch-icon" href="/images/logo-icon.png" />

      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('yegna_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
