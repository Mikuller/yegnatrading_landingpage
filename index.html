    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Yegna Trading PLC",
        "image": "https://yegnatradinget.com/images/logo-main.png",
        "url": "https://yegnatradinget.com/",
        "telephone": "+251943000005",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Kazanchis Joburg Building 5th Floor",
          "addressLocality": "Addis Ababa",
          "addressCountry": "ET"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 9.0175,
          "longitude": 38.7685
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "08:30",
            "closes": "17:30"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",

            "closes": "12:30"
          }
        ],
        "sameAs": [
          "https://web.facebook.com/profile.php?id=61566925694036",
          "https://www.linkedin.com/company/yegna-trading-plc",
          "https://www.instagram.com/yegnatradinget",

          "https://www.tiktok.com/@getyegna"
        ]
      }
    </script>

    <!-- Theme restoration script -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('yegna_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>

  </body>
