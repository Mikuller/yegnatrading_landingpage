<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b0e" />
    <title>Contact & Request a Quote | Yegna Trading PLC Addis Ababa</title>
    <meta
      name="description"
      content="Get an instant quote for certified rebar, cement, and construction materials. Visit our Kazanchis Head Office or call our direct order desk."
    />
    <link rel="canonical" href="https://yegnatradinget.com/contact/" />
    <link rel="icon" type="image/png" href="/images/logo-icon.png" />
    <link rel="apple-touch-icon" href="/images/logo-icon.png" />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yegna Trading PLC" />
    <meta property="og:url" content="https://yegnatradinget.com/contact/" />
    <meta property="og:title" content="Contact & Request a Quote | Yegna Trading PLC Addis Ababa" />
    <meta
      property="og:description"
      content="Connect with Yegna Trading PLC's order desk in Kazanchis, Addis Ababa. Request quotations, delivery schedules, and technical support."
    />
    <meta property="og:image" content="/images/logo-main.png" />
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Contact & Quotations | Yegna Trading PLC" />
    <meta
      name="twitter:description"
      content="Kazanchis Joburg Building 5th Floor, Addis Ababa. Instant quotes and site dispatch."
    />
    <meta name="twitter:image" content="/images/logo-main.png" />

    <!-- Google Fonts & Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ContactPage",
        "name": "Contact Yegna Trading PLC",
        "url": "https://yegnatradinget.com/contact/",
        "mainEntity": {
          "@type": "LocalBusiness",
          "name": "Yegna Trading PLC",
          "telephone": "+251943000005",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Kazanchis Joburg Building 5th Floor",
            "addressLocality": "Addis Ababa",
            "addressCountry": "ET"
          },
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": 9.0175,
            "longitude": 38.7685
          }
        },
        "breadcrumb": {
          "@type": "BreadcrumbList",
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Home",
              "item": "https://yegnatradinget.com/"
            },
            {
              "@type": "ListItem",
              "position": 2,
              "name": "Contact Us",
              "item": "https://yegnatradinget.com/contact/"
            }
          ]
        }
      }
    </script>

    <!-- Theme restoration script -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('yegna_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/contact.tsx"></script>
  </body>
</html>
