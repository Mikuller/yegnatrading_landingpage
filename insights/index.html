<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b0e" />
    <title>Construction Insights & Rebar Market News | Yegna Trading Ethiopia</title>
    <meta
      name="description"
      content="Read expert construction guides, OPC vs PPC cement comparisons, rebar delivery planning, and steel price trends in Addis Ababa, Ethiopia."
    />
    <link rel="canonical" href="https://yegnatradinget.com/insights/" />
    <link rel="icon" type="image/png" href="/images/logo-icon.png" />
    <link rel="apple-touch-icon" href="/images/logo-icon.png" />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="blog" />
    <meta property="og:site_name" content="Yegna Trading PLC" />
    <meta property="og:url" content="https://yegnatradinget.com/insights/" />
    <meta property="og:title" content="Construction Insights & Rebar Market News | Yegna Trading Ethiopia" />
    <meta
      property="og:description"
      content="Technical guides, market updates, and expert steel selection advice for construction projects across Ethiopia."
    />
    <meta property="og:image" content="/images/logo-main.png" />
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Construction Insights & Guides | Yegna Trading PLC" />
    <meta
      name="twitter:description"
      content="Stay updated with technical guides, cement comparisons, and rebar market advice in Addis Ababa."
    />
    <meta name="twitter:image" content="/images/logo-main.png" />

    <!-- Google Fonts & Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Blog",
        "name": "Yegna Trading Construction Insights",
        "url": "https://yegnatradinget.com/insights/",
        "description": "Educational articles, market updates, and technical guides on Ethiopian construction materials.",
        "breadcrumb": {
          "@type": "BreadcrumbList",
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Home",
              "item": "https://yegnatradinget.com/"
            },
            {
              "@type": "ListItem",
              "position": 2,
              "name": "Insights & Blog",
              "item": "https://yegnatradinget.com/insights/"
            }
          ]
        }
      }
    </script>

    <!-- Theme restoration script -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('yegna_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/insights.tsx"></script>
  </body>
</html>
