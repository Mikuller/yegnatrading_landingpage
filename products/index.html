<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b0e" />
    <title>Certified Steel Rebar, Cement & Plywood | Yegna Trading Ethiopia</title>
    <meta
      name="description"
      content="Explore Grade 75 deformed rebar (8mm–32mm), OPC/PPC cement, 6mm staffa steel coil, and phenolic formwork plywood. View technical specs & rebar weight charts."
    />
    <link rel="canonical" href="https://yegnatradinget.com/products/" />
    <link rel="icon" type="image/png" href="/images/logo-icon.png" />
    <link rel="apple-touch-icon" href="/images/logo-icon.png" />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yegna Trading PLC" />
    <meta property="og:url" content="https://yegnatradinget.com/products/" />
    <meta property="og:title" content="Certified Steel Rebar, Cement & Plywood | Yegna Trading Ethiopia" />
    <meta
      property="og:description"
      content="Grade 75 deformed steel rebar (8mm to 32mm), Portland cement, 6mm staffa coil, and construction plywood specs with live metric calculator."
    />
    <meta property="og:image" content="/images/logo-main.png" />
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Products & Rebar Specifications | Yegna Trading PLC" />
    <meta
      name="twitter:description"
      content="View full rebar weight conversion charts, Grade 75 mill test specs, cement, and construction plywood."
    />
    <meta name="twitter:image" content="/images/logo-main.png" />

    <!-- Google Fonts & Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "Yegna Trading Construction Materials Catalog",
        "url": "https://yegnatradinget.com/products/",
        "itemListElement": [
          {
            "@type": "Product",
            "position": 1,
            "name": "Reinforcement Bar (Grade 75)",
            "description": "High-strength deformed rebar conforming to Ethiopian & international standards (8mm – 32mm) for concrete reinforcement.",
            "category": "Steel Construction Materials"
          },
          {
            "@type": "Product",
            "position": 2,
            "name": "Portland Cement (OPC & PPC)",
            "description": "High-grade Ordinary Portland Cement & Pozzolana Portland Cement bags for foundations, columns, and structural casting.",
            "category": "Cement & Binders"
          },
          {
            "@type": "Product",
            "position": 3,
            "name": "Steel Coil (Staffa 6mm)",
            "description": "6mm high-tensile wire coil engineered for column stirrups, beam links, and structural ties.",
            "category": "Steel Wire"
          },
          {
            "@type": "Product",
            "position": 4,
            "name": "Formwork Plywood",
            "description": "Phenolic film faced and marine grade multi-layer formwork sheets for smooth concrete casting.",
            "category": "Formwork & Timber"
          }
        ]
      }
    </script>

    <!-- Theme restoration script -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('yegna_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/products.tsx"></script>
  </body>
</html>
