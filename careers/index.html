<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b0e" />
    <title>Careers at Yegna Trading PLC | Join Our Supply Chain Team</title>
    <meta
      name="description"
      content="Join Yegna Trading PLC in Addis Ababa. Explore career opportunities in construction logistics, sales, finance, and supply chain management."
    />
    <link rel="canonical" href="https://yegnatradinget.com/careers/" />
    <link rel="icon" type="image/png" href="/images/logo-icon.png" />
    <link rel="apple-touch-icon" href="/images/logo-icon.png" />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yegna Trading PLC" />
    <meta property="og:url" content="https://yegnatradinget.com/careers/" />
    <meta property="og:title" content="Careers at Yegna Trading PLC | Join Our Supply Chain Team" />
    <meta
      property="og:description"
      content="Build your career with Ethiopia's certified rebar and building materials supplier in Addis Ababa."
    />
    <meta property="og:image" content="/images/logo-main.png" />
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Careers at Yegna Trading PLC Ethiopia" />
    <meta
      name="twitter:description"
      content="Explore professional growth opportunities in construction supply and logistics."
    />
    <meta name="twitter:image" content="/images/logo-main.png" />

    <!-- Google Fonts & Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AboutPage",
        "name": "Careers at Yegna Trading PLC",
        "url": "https://yegnatradinget.com/careers/",
        "description": "Employment opportunities, career progression, and culture at Yegna Trading PLC.",
        "breadcrumb": {
          "@type": "BreadcrumbList",
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Home",
              "item": "https://yegnatradinget.com/"
            },
            {
              "@type": "ListItem",
              "position": 2,
              "name": "Careers",
              "item": "https://yegnatradinget.com/careers/"
            }
          ]
        }
      }
    </script>

    <!-- Theme restoration script -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('yegna_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/careers.tsx"></script>
  </body>
</html>
