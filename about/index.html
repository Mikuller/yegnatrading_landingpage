    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b0e" />
    <title>About Us | Yegna Trading PLC - Ethiopian Steel & Building Materials</title>
    <meta
      name="description"
      content="Discover Yegna Trading PLC's 10+ year legacy delivering mill-tested Grade 75 rebar, our corporate leadership, values, and community commitment in Addis Ababa, Ethiopia."
    />
    <link rel="canonical" href="https://yegnatradinget.com/about/" />
    <link rel="icon" type="image/png" href="/images/logo-icon.png" />
    <link rel="apple-touch-icon" href="/images/logo-icon.png" />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Yegna Trading PLC" />

    <meta
      property="og:description"
      content="Learn about Yegna Trading PLC, established in 2017 in Addis Ababa. Trusted supplier of Grade 75 rebar, cement, and construction materials."
    />
    <meta property="og:image" content="/images/logo-main.png" />
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="About Us | Yegna Trading PLC Ethiopia" />
    <meta
      name="twitter:description"

    />

    <!-- Google Fonts & Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AboutPage",
        "name": "About Yegna Trading PLC",
        "description": "Information about Yegna Trading PLC's company profile, mission, executive team, and construction supply services in Ethiopia.",
        "url": "https://yegnatradinget.com/about/",
        "breadcrumb": {
          "@type": "BreadcrumbList",
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Home",
              "item": "https://yegnatradinget.com/"
            },
            {
              "@type": "ListItem",
              "position": 2,
              "name": "About Us",
              "item": "https://yegnatradinget.com/about/"
            }
          ]
        }
      }
    </script>

    <!-- Theme restoration script -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('yegna_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/about.tsx"></script>
  </body>
</html>
